server:
  port: 8080

spring:
  application:
    name: pubg-insight-backend
  profiles:
    active: local

logging:
  level:
    root: INFO

pubg:
  api:
    base-url: https://api.pubg.com
    key: ${PUBG_API_KEY:placeholder-api-key}
    default-shard: ${PUBG_DEFAULT_SHARD:steam}

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY:placeholder-api-key}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    analysis-history-table: ${DYNAMODB_ANALYSIS_HISTORY_TABLE:pubg-insight-analysis-history}
  s3:
    cache-bucket: ${S3_CACHE_BUCKET:pubg-insight-match-cache}