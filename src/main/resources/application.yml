server:
  port: ${PORT:8080}

spring:
  application:
    name: pubg-insight-backend
  profiles:
    active: local

logging:
  level:
    root: INFO

pubg:
  api:
    base-url: https://api.pubg.com
    key: ${PUBG_API_KEY}
    default-shard: ${PUBG_DEFAULT_SHARD:steam}

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY}
    models: ${GEMINI_MODELS:gemini-3.5-flash-lite}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    analysis-history-table: ${DYNAMODB_ANALYSIS_HISTORY_TABLE:pubg-insight-analysis-history}
    season-stats-cache-table: ${DYNAMODB_SEASON_STATS_CACHE_TABLE:pubg-insight-season-stats-cache}
  s3:
    cache-bucket: ${S3_CACHE_BUCKET:pubg-insight-match-cache}
  athena:
    database: ${ATHENA_DATABASE:pubg_insight}
    table: ${ATHENA_TABLE:pubg_insight_analytics}
    output-location: ${ATHENA_OUTPUT_LOCATION:s3://pubg-insight-match-cache/athena-results/}